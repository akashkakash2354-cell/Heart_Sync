<!DOCTYPE html>
<html>
<head>
    <title>Send Invite</title>
</head>
<body>

    <h2>❤️ Send Invite</h2>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Send Invite
        </button>
    </form>

</body>
</html>
