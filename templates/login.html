<!DOCTYPE html>
<html>
<head>
    <title>HeartSync Login</title>
</head>

<body>

<h1>❤️ HeartSync Login</h1>

<form method="POST">
    {% csrf_token %}

    <label>Username:</label>
    <input type="text" name="username">

    <br><br>

    <label>Password:</label>
    <input type="password" name="password">

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

</body>
</html>
